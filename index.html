<div id="lk"><div class="lkc"><div class="lki">🎓</div><h1>My Teacher</h1><p>Enter password</p><input id="lkp" type="password" inputmode="numeric" autocomplete="off" placeholder="Password"><button id="lkb" type="button">Open</button><div id="lke"></div></div></div>
<script>(function(){
var PW='113322',lk=document.getElementById('lk'),inp=document.getElementById('lkp'),er=document.getElementById('lke');
function ok(){try{return sessionStorage.getItem('tr_ok')==='1';}catch(e){return false;}}
function open(){lk.style.display='none';document.body.style.overflow='';}
if(ok()){open();return;}
document.body.style.overflow='hidden';
function go(){
if(inp.value===PW){try{sessionStorage.setItem('tr_ok','1');}catch(e){}open();}
else{er.textContent='Wrong password. Try again.';inp.value='';inp.focus();}
}
document.getElementById('lkb').onclick=go;
inp.onkeydown=function(e){if(e.key==='Enter')go();};
setTimeout(function(){try{inp.focus();}catch(e){}},200);
})();</script>
