<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a7280;--ac:#0f766e;--bd:#d9dde3;--hl:#fcd34d;--hp:#e3f3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#181d23;--tx:#e8ebef;--mut:#98a1ad;--ac:#2dd4bf;--bd:#2b323b;--hl:#fbbf24;--hp:#12332f}}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:1rem}
.w{max-width:46rem;margin:0 auto;min-height:calc(100vh - 2rem);min-height:calc(100dvh - 2rem);display:flex;flex-direction:column}
h1{font-size:1.4rem;margin:0 0 .75rem}
.c{flex:1;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:.75rem;padding:.9rem}
textarea,#view{width:100%;flex:1 1 0;min-height:10rem;font:1.15rem/1.7 system-ui,sans-serif;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:.5rem;padding:.7rem;resize:none}
#view{display:none;overflow:auto}
#view .p{white-space:pre-wrap;padding:.4rem .5rem;border-radius:.4rem;margin:0 0 .4rem;cursor:pointer}
#view .p.a{background:var(--hp);box-shadow:inset .2rem 0 0 var(--ac)}
mark{background:var(--hl);color:#111;font-weight:700;border-radius:.25rem;padding:1px 3px;box-shadow:0 0 0 2px var(--hl)}
label{display:block;font-size:.9rem;color:var(--mut);margin:.7rem 0 .25rem}
input[type=search],select{width:100%;padding:.65rem;font-size:1rem;border-radius:.5rem;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=search]{margin-bottom:.4rem}
input[type=range]{width:100%;height:1.6rem}
.tc{display:flex;align-items:center;gap:.6rem;margin-top:1rem;font-size:1rem;color:var(--tx)}
.tc input{width:1.3rem;height:1.3rem;accent-color:var(--ac)}
.r{display:flex;gap:.5rem;margin-top:.9rem}
button{flex:1;min-width:0;padding:.9rem .5rem;border:0;border-radius:.6rem;font-size:1.05rem;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}
.m{font-size:.85rem;color:var(--mut);margin-top:.6rem;min-height:1.2rem}
</style>
</head>
<body>
<div class="w">
<h1>Text Reader</h1>
<div class="c">
<textarea id="t" placeholder="Paste or type text here..."></textarea>
<div id="view"></div>
<label>Read in (language)</label>
<input type="search" id="ls" placeholder="Search language...">
<select id="lg"></select>
<label>Voice</label>
<select id="v"></select>
<label>Speed: <span id="rv">1.0</span>x</label>
<input type="range" id="rt" min="0.5" max="2" step="0.1" value="1">
<label>Pitch: <span id="pv">1.0</span></label>
<input type="range" id="pt" min="0.5" max="2" step="0.1" value="1">
<label class="tc"><input type="checkbox" id="tc">Teacher mode (lecture + extra explanation)</label>
<div class="r">
<button id="play">Play</button>
<button id="pause" class="s">Pause</button>
<button id="stop" class="s">Stop</button>
</div>
<div class="m" id="msg"></div>
</div>
</div>
<script>(function(){function f(){var iw=window.innerWidth,sw=screen.width,k=(sw>0&&sw<700&&iw>sw*1.25)?iw/sw:1;document.documentElement.style.fontSize=(16*k)+'px';}f();window.addEventListener('resize',f);window.addEventListener('orientationchange',function(){setTimeout(f,200)});})();</script>
<script>
(function(){
var S=window.speechSynthesis,$=function(i){return document.getElementById(i)},
T=$('t'),V=$('view'),sel=$('v'),ls=$('ls'),lg=$('lg'),rt=$('rt'),pt=$('pt'),msg=$('msg');
if(!S){msg.textContent='Text-to-speech is not supported in this browser.';return;}
var paras=[],orig_='',tm=null,sid=0,paused=false,pf=false,mpc1=55,cal=false,cur=null,bc=0,t0=0,est={k:0,w:[],D:0};
var LANGS=[
['ur','Urdu','اردو','ur-PK'],['en','English','English','en-US'],['hi','Hindi','हिन्दी','hi-IN'],['ar','Arabic','العربية','ar-SA'],['pa','Punjabi','ਪੰਜਾਬੀ','pa-IN'],['ps','Pashto','پښتو','ps-AF'],['sd','Sindhi','سنڌي','sd-PK'],['fa','Persian','فارسی','fa-IR'],['bn','Bengali','বাংলা','bn-BD'],
['zh-CN','Chinese (Simplified)','中文','zh-CN','zh'],['zh-TW','Chinese (Traditional)','繁體中文','zh-TW','zh'],['fr','French','Français','fr-FR'],['de','German','Deutsch','de-DE'],['es','Spanish','Español','es-ES'],['pt','Portuguese','Português','pt-PT'],['it','Italian','Italiano','it-IT'],['ru','Russian','Русский','ru-RU'],['tr','Turkish','Türkçe','tr-TR'],['ja','Japanese','日本語','ja-JP'],['ko','Korean','한국어','ko-KR'],
['id','Indonesian','Bahasa Indonesia','id-ID','id|in'],['ms','Malay','Bahasa Melayu','ms-MY'],['nl','Dutch','Nederlands','nl-NL'],['pl','Polish','Polski','pl-PL'],['uk','Ukrainian','Українська','uk-UA'],['el','Greek','Ελληνικά','el-GR'],['he','Hebrew','עברית','he-IL','he|iw'],['th','Thai','ไทย','th-TH'],['vi','Vietnamese','Tiếng Việt','vi-VN'],
['sv','Swedish','Svenska','sv-SE'],['no','Norwegian','Norsk','nb-NO','nb|no|nn'],['da','Danish','Dansk','da-DK'],['fi','Finnish','Suomi','fi-FI'],['cs','Czech','Čeština','cs-CZ'],['ro','Romanian','Română','ro-RO'],['hu','Hungarian','Magyar','hu-HU'],['bg','Bulgarian','Български','bg-BG'],['hr','Croatian','Hrvatski','hr-HR'],['sk','Slovak','Slovenčina','sk-SK'],['ca','Catalan','Català','ca-ES'],
['ta','Tamil','தமிழ்','ta-IN'],['te','Telugu','తెలుగు','te-IN'],['mr','Marathi','मराठी','mr-IN'],['gu','Gujarati','ગુજરાતી','gu-IN'],['kn','Kannada','ಕನ್ನಡ','kn-IN'],['ml','Malayalam','മലയാളം','ml-IN'],['ne','Nepali','नेपाली','ne-NP'],['si','Sinhala','සිංහල','si-LK'],['sw','Swahili','Kiswahili','sw-KE'],['af','Afrikaans','Afrikaans','af-ZA'],['tl','Filipino','Filipino','fil-PH','fil|tl']
].map(function(r){return {tl:r[0],n:r[1],nn:r[2],sc:r[3],sp:r[4]||r[3].split('-')[0]}});
var tgt=null;
function curLang(){for(var i=0;i<LANGS.length;i++){if(LANGS[i].tl===lg.value)return LANGS[i];}return null;}
function preOf(L){return new RegExp('^(?:'+L.sp+')','i');}
function fillLangs(){
var q=ls.value.trim().toLowerCase(),prev=lg.value,h='<option value="">Same as text (no translation)</option>',first='',has=false;
LANGS.forEach(function(L){
if(q&&(L.n+' '+L.nn+' '+L.tl).toLowerCase().indexOf(q)<0)return;
if(!first)first=L.tl;if(L.tl===prev)has=true;
h+='<option value="'+L.tl+'">'+L.n+' ('+L.nn+')</option>';
});
lg.innerHTML=h;
lg.value=(q&&first&&!has)?first:(has?prev:'');
if(q&&first&&lg.value===''&&!has)lg.value=first;
fillVoices();
}
function fillVoices(){
var vs=S.getVoices(),L=curLang(),pre=L?preOf(L):null,prev=sel.value,n=0;
sel.innerHTML='<option value="-2">Auto (best voice)</option><option value="-1">Device default</option>';
vs.forEach(function(x,i){if(pre&&!pre.test(x.lang))return;var o=document.createElement('option');o.value=i;o.textContent=x.name+' ('+x.lang+')';sel.appendChild(o);n++;});
for(var j=0;j<sel.options.length;j++){if(sel.options[j].value===prev){sel.value=prev;break;}}
}
ls.oninput=fillLangs;
lg.onchange=fillVoices;
fillLangs();S.onvoiceschanged=fillVoices;
rt.oninput=function(){$('rv').textContent=(+rt.value).toFixed(1)};
pt.oninput=function(){$('pv').textContent=(+pt.value).toFixed(1)};
function esc(x){return x.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(on){V.style.display=on?'block':'none';T.style.display=on?'none':'block';}
function clr(){if(tm){clearTimeout(tm);tm=null;}}
var pe=[],pa=-1;
function build(){
V.innerHTML='';pe=[];pa=-1;
paras.forEach(function(q){var d=document.createElement('div');d.className='p';d.setAttribute('data-s',q.s);d.textContent=orig_.slice(q.s,q.e);V.appendChild(d);pe.push(d);});
}
function render(pos,len){
var n=-1,j;
for(j=0;j<paras.length;j++){if(pos>=paras[j].s&&pos<paras[j].e){n=j;break;}}
if(n<0){for(j=0;j<paras.length;j++){if(paras[j].s>=pos){n=j;break;}}}
if(n<0)return;
if(pa>=0&&pa!==n){pe[pa].className='p';pe[pa].textContent=orig_.slice(paras[pa].s,paras[pa].e);}
pa=n;
var q=paras[n],t=orig_.slice(q.s,q.e),a=Math.max(0,pos-q.s),el=pe[n];
el.className='p a';
el.innerHTML=esc(t.slice(0,a))+(len>0?'<mark>'+esc(t.substr(a,len))+'</mark>':'')+esc(t.slice(a+len));
var k=el.querySelector('mark')||el;
if(k.scrollIntoView)k.scrollIntoView({block:'nearest'});
}
function step(k){
if(k>=est.w.length)return;
est.k=k;var w=est.w[k];render(w.i,w.l);
tm=setTimeout(function(){step(k+1)},est.D*w.f);
}
function startEst(c,skip,rate){
var rx=/\S+/g,m,seg=orig_.slice(c.s,c.e),ws=[],W=0;
while((m=rx.exec(seg))){var t=m[0],wt=t.length+1+(/[.!?\u06D4\u061F]$/.test(t)?5:(/[,;:\u060C]$/.test(t)?2:0));
ws.push({i:c.s+m.index,l:t.length,wt:wt});W+=wt;}
if(!ws.length)return;
ws.forEach(function(w){w.f=w.wt/W});
est={k:0,w:ws,D:(mpc1/rate)*(c.e-c.s)};
var acc=0,k=0;
while(k<ws.length){var d=est.D*ws[k].f;if(acc+d>=skip)break;acc+=d;k++;}
step(k);
}
function chunks(txt,base){
var out=[],rx=/[^.!?\n\u06D4\u061F\u0964\u3002\uFF01\uFF1F]+[.!?\u06D4\u061F\u0964\u3002\uFF01\uFF1F]*/g,m;
rx.lastIndex=base;
while((m=rx.exec(txt))){
var st=m.index,e=st+m[0].length;
while(e-st>180){var cut=txt.lastIndexOf(' ',st+150);if(cut<=st)cut=st+150;out.push({s:st,e:cut});st=cut;}
if(txt.slice(st,e).trim())out.push({s:st,e:e});
}
return out;
}
function run(mode,tries,base){
var my=++sid;clr();S.cancel();paused=false;
var txt=orig_.replace(/[#*_`>~|]/g,' '),cs=chunks(txt,base);
if(!cs.length){show(false);return;}
paras=[];var rx=/[^\n]+/g,mm;
while((mm=rx.exec(orig_))){if(mm[0].trim())paras.push({s:mm.index,e:mm.index+mm[0].length});}
V.dir=/[\u0590-\u08FF]/.test(orig_)?'rtl':'ltr';build();render(base,0);show(true);
var rate=+rt.value,pitch=+pt.value,vs=S.getVoices(),ar=/[\u0600-\u06FF]/.test(txt),v=null,lang,dl=tgt?tgt.sc:(ar?'ur-PK':'en-US');
if(mode==='sel'&&vs[sel.value]){v=vs[sel.value];lang=v.lang;}
else if(mode==='auto'){
var pre=tgt?preOf(tgt):(ar?/^ur/i:/^en/i);
v=vs.filter(function(x){return pre.test(x.lang)&&x.localService!==false})[0]||vs.filter(function(x){return pre.test(x.lang)})[0]||null;
lang=v?v.lang:dl;
}else lang=dl;
setTimeout(function(){
if(my!==sid)return;
var qd={};
function mk(ix){
if(ix>=cs.length||qd[ix])return;qd[ix]=1;var c=cs[ix];
var u=new SpeechSynthesisUtterance(txt.slice(c.s,c.e));
if(v)u.voice=v;
u.lang=lang;u.rate=rate;u.pitch=pitch;
u.onstart=function(){
if(my!==sid)return;
mk(ix+2);
clr();cur=c;bc=0;pf=false;est={k:0,w:[],D:0};t0=Date.now();msg.textContent='Reading...';
tm=setTimeout(function(){if(my===sid&&cur===c&&!bc)startEst(c,Date.now()-t0,rate);},350);
};
u.onboundary=function(e){
if(my!==sid)return;
if(e.name&&e.name!=='word')return;
bc++;clr();
var i=e.charIndex+c.s,m=/\S+/.exec(orig_.slice(i));
render(i,m?m[0].length:1);
};
u.onend=function(){
if(my!==sid)return;
clr();
var len=c.e-c.s,a=Date.now()-t0;
if(!bc&&!pf&&len>15&&a>200){var obs=a/len*rate;mpc1=cal?0.5*mpc1+0.5*obs:obs;cal=true;}
if(ix===cs.length-1){show(false);msg.textContent='';}
else{var nx=cs[ix+1],m2=/\S+/.exec(orig_.slice(nx.s));render(nx.s,m2?m2[0].length:1);}
};
u.onerror=function(e){
if(my!==sid)return;
if(e.error==='interrupted'||e.error==='canceled')return;
clr();
var nx=mode==='sel'?'auto':(mode==='auto'?'def':'');
if(nx&&tries<2){S.cancel();setTimeout(function(){run(nx,tries+1,c.s)},150);return;}
sid++;show(false);
msg.textContent='Error: '+e.error+'. Install voice data in phone Settings > Text-to-speech.';
};
S.speak(u);
}
mk(0);mk(1);
},120);
}
var cache={},busy=false;
function piece(q,tl){
return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+tl+'&dt=t&q='+encodeURIComponent(q))
.then(function(r){return r.json()}).then(function(j){return j[0].map(function(x){return x[0]}).join('')})
.catch(function(){return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=Autodetect|'+tl)
.then(function(r){return r.json()}).then(function(j){if(j.responseStatus!=200)throw 0;return j.responseData.translatedText})});
}
function tline(line,tl){
var ps=[],cur_='',ss=line.match(/[^.!?\n\u06D4\u061F\u0964\u3002\uFF01\uFF1F]+[.!?\u06D4\u061F\u0964\u3002\uFF01\uFF1F]*/g)||[line];
ss.forEach(function(x){if((cur_+x).length>400&&cur_){ps.push(cur_);cur_='';}cur_+=x;});
if(cur_.trim())ps.push(cur_);
return ps.reduce(function(p,q){return p.then(function(acc){return piece(q,tl).then(function(t){return acc+(acc?' ':'')+t})})},Promise.resolve(''));
}
function tr(text,tl){
var ls_=text.split('\n');
return ls_.reduce(function(p,l){return p.then(function(acc){
if(!l.trim()){acc.push('');return acc;}
return tline(l.trim(),tl).then(function(t){acc.push(t);return acc;});
});},Promise.resolve([])).then(function(a){return a.join('\n')});
}
function mode(){return sel.value==='-2'?'auto':(sel.value==='-1'?'def':'sel');}
function teach(o,L){
var lang=L?L.n:'the same language as the text',ac=new AbortController(),t=setTimeout(function(){ac.abort()},60000);
var sys='You are a kind, clear teacher giving a spoken lecture to a student. Explain the given text in '+lang+'. First explain the main idea simply, then go through each point with extra details, reasons, simple examples and things to remember, then finish with a short summary. Write plain spoken paragraphs only: no markdown, no headings, no bullet symbols, no emojis.';
return fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,
body:JSON.stringify({model:'openai',messages:[{role:'system',content:sys},{role:'user',content:o.slice(0,6000)}]})})
.then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.text()})
.then(function(x){x=x.replace(/[#*_`>~|]/g,' ').replace(/\n{3,}/g,'\n\n').trim();if(!x)throw 0;return x;});
}
$('play').onclick=function(){
if(paused){S.resume();paused=false;if(!bc&&est.w.length)step(est.k);return;}
var o=T.value.trim();if(!o||busy)return;
tgt=curLang();
var tc=$('tc').checked,key=(tc?'T|':'')+(tgt?tgt.tl:'')+'|'+o;
function go(t){
orig_=t;
if(tgt){
var vs=S.getVoices(),pre=preOf(tgt);
if(vs.length&&!vs.some(function(x){return pre.test(x.lang)}))msg.textContent='No '+tgt.n+' voice installed. Trying device default...';
}
run(mode(),0,0);
}
if(!tc&&!tgt){orig_=o;run(mode(),0,0);return;}
if(cache[key]){go(cache[key]);return;}
busy=true;
var job;
if(tc){msg.textContent='Teacher is preparing the lecture...';job=teach(o,tgt);}
else{msg.textContent='Translating to '+tgt.n+'...';job=tr(o.replace(/[#*_`>~|]/g,' '),tgt.tl);}
job.then(function(t){busy=false;cache[key]=t;go(t);})
.catch(function(){busy=false;msg.textContent=tc?'Teacher could not respond. Check your internet and try again.':'Translation needs an internet connection. Check and try again.';});
};
$('pause').onclick=function(){
if(S.speaking&&!paused){S.pause();paused=true;pf=true;clr();}
};
function stop(){sid++;clr();S.cancel();paused=false;show(false);msg.textContent='';}
$('stop').onclick=stop;
V.onclick=function(e){
var d=e.target.closest?e.target.closest('.p'):null;
if(!d)return;
run(mode(),0,+d.getAttribute('data-s'));
};
})();
</script>
